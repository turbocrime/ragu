[package]
name = "ragu"
version.workspace = true
authors.workspace = true
description = "Proof-carrying data (PCD) framework for Rust"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ragu"
categories = ["cryptography", "mathematics", "algorithms", "science", "no-std"]
keywords = ["cryptography", "zero-knowledge", "proof-carrying-data", "pcd", "recursion"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
all-features = true

[features]
default = ["multicore"]
# Opt-in API-level mock of `ragu_pcd` (see the crate docs). Off by default.
mock = [
  "dep:blake2b_simd",
  "dep:ragu_arithmetic",
  "dep:ragu_core",
  "dep:ragu_pasta",
]
multicore = ["ragu_arithmetic?/multicore"]
std = []

[lib]
bench = false

# mock dependencies (pulled in only by the `mock` feature). The mock defines
# only what a consumer cannot import from a real Ragu crate, so this list is
# limited to the crates its own signatures name. Consumers depend on
# `ragu_circuits`, `ragu_primitives` and the rest directly.
[dependencies]
blake2b_simd = { workspace = true, optional = true }
ragu_arithmetic = { path = "crates/ragu_arithmetic", version = "0.0.0", default-features = false, features = ["alloc"], optional = true }
ragu_core = { path = "crates/ragu_core", version = "0.0.0", default-features = false, features = ["alloc"], optional = true }
ragu_pasta = { path = "crates/ragu_pasta", version = "0.0.0", default-features = false, features = ["alloc"], optional = true }

[workspace]
members = [
  "crates/ragu_acceleration",
  "crates/ragu_arithmetic",
  "crates/ragu_backend",
  "crates/ragu_circuits",
  "crates/ragu_core",
  "crates/ragu_gadgets",
  "crates/ragu_macros",
  "crates/ragu_pasta",
  "crates/ragu_primitives",
  "crates/ragu_pcd",
  "crates/ragu_testing",
  "qa/crates/lean_extraction",
]

resolver = "2"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"

[workspace.package]
version = "0.0.0"
authors = ["Sean Bowe <ewillbefull@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.97"
homepage = "https://github.com/tachyon-zcash/ragu"
repository = "https://github.com/tachyon-zcash/ragu"

[workspace.dependencies]
# Keep ff/group/pasta_curves/rand in sync with qa/fuzz/Cargo.toml. The
# cargo-fuzz workspace is intentionally isolated and cannot inherit these
# workspace dependencies.
#
# `pasta_curves` is Zakura's fork (crates.io package `zakura-pasta-curves`,
# library target still `pasta_curves`, published from
# https://github.com/zakura-core/libraries), so Ragu and Zakura agree on the
# curve types. The pre-release tag must be named explicitly: cargo's semver
# rules mean a bare `1` requirement would not match `1.0.0-rc.2`.
ff = { version = "0.14", default-features = false }
group = { version = "0.14", default-features = false }
pasta_curves = { package = "zakura-pasta-curves", version = "1.0.0-rc.2", features = ["deferred"] }
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
rand_core = { version = "0.10", default-features = false }
lazy_static = "1.5.0"
proptest = "1.11.0"
gungraun = "0.17.0"
blake2b_simd = { version = "1.0", default-features = false }
maybe-rayon = { git = "https://github.com/tachyon-zcash/maybe-rayon.git", rev = "5c37ee0dd448e8c1edc4529d0b8897ecaff5aad1", default-features = false }
criterion = { version = "0.5", default-features = false }
