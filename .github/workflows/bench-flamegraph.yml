name: Flamegraph Comment

on:
  workflow_run:
    workflows: ["Benchmarks"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read
  contents: write

jobs:
  flamegraph-comment:
    name: Post flamegraph previews
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Determine PR number
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
              --repo ${{ github.repository }} \
              --state open \
              --json number,headRefName,headRefOid,headRepositoryOwner \
            | jq --raw-output --from-file .github/scripts/find-pr.jq \
              --arg pr_owner '${{ github.event.workflow_run.head_repository.owner.login }}' \
              --arg pr_branch '${{ github.event.workflow_run.head_branch }}' \
              --arg pr_sha '${{ github.event.workflow_run.head_sha }}')
          echo "pr_number=${PR_NUMBER}" | tee $GITHUB_OUTPUT

      - name: Download flamegraph artifact
        if: steps.find_pr.outputs.pr_number
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: flamegraphs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ./flamegraphs

      - name: Convert SVGs to PNGs
        if: steps.download.outcome == 'success'
        id: convert
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin > /dev/null

          mkdir -p ./pngs
          count=0
          for svg in $(find ./flamegraphs -name '*.svg' -type f); do
            basename=$(basename "$svg" .svg)
            rsvg-convert --width 1200 "$svg" -o "./pngs/${basename}.png"
            count=$((count + 1))
          done
          echo "count=${count}" | tee $GITHUB_OUTPUT

      - name: Push preview images
        if: steps.convert.outputs.count > 0
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch or create the flamegraphs branch
          if git fetch origin flamegraphs --depth=1 2>/dev/null; then
            git checkout flamegraphs
          else
            git checkout --orphan flamegraphs
            git rm -rf . 2>/dev/null || true
            git commit --allow-empty -m "initialize flamegraphs branch"
          fi

          dest="pr/${PR_NUMBER}/${SHA:0:7}"
          mkdir -p "$dest"
          cp ./pngs/*.png "$dest/"

          git add "$dest"
          git commit -m "flamegraphs for PR #${PR_NUMBER} @ ${SHA:0:7}"
          git push origin flamegraphs

      - name: Build comment body
        if: steps.convert.outputs.count > 0
        id: comment
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          dest="pr/${PR_NUMBER}/${SHA:0:7}"
          {
            echo "body<<EOF"
            echo "## Flamegraphs"
            echo ""
            for png in ./pngs/*.png; do
              name=$(basename "$png" .png)
              url="https://raw.githubusercontent.com/${{ github.repository }}/flamegraphs/${dest}/${name}.png"
              echo "### ${name}"
              echo "![${name}](${url})"
              echo ""
            done
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Post flamegraph comment
        if: steps.comment.outputs.body
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ steps.find_pr.outputs.pr_number }}
          comment-tag: flamegraph
          mode: recreate
          message: ${{ steps.comment.outputs.body }}
